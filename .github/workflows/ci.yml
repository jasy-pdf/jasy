name: CI

# Full truth check on the protected branch. PRs run lean + filtered; main runs everything, on every
# supported Node version. Same staged gating (lint -> build -> test) so failures stop early.
on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run fmt:check

  build:
    name: Build
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --include-workspace-root build

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Full suite (engine + @jasy/e-invoice + @jasy/vue + @jasy/react; @jasy/nuxt e2e excluded by the root
      # vitest config).
      - run: pnpm exec vitest run

  react:
    name: React ${{ matrix.react }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["19.0", "19.1", "19.2", "19.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @jasy/react promises every React 19 minor with one reconciler: pin each one and run its suite.
      - run: pnpm --filter @jasy/react add -D react@~${{ matrix.react }}.0 react-dom@~${{ matrix.react }}.0
      - run: pnpm exec vitest run packages/react

  angular:
    name: Angular ${{ matrix.angular }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular: ["20", "21", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @jasy/angular promises Angular 20 and newer: the newest release of each major, with its suite.
      # From 21 on Angular provides HttpClient in root, which changes how a URL is loaded.
      - run: >-
          pnpm --filter @jasy/angular add -D
          @angular/core@${{ matrix.angular }} @angular/common@${{ matrix.angular }}
          @angular/compiler@${{ matrix.angular }} @angular/forms@${{ matrix.angular }}
          @angular/platform-browser@${{ matrix.angular }}
          @angular/platform-browser-dynamic@${{ matrix.angular }}
          @angular/platform-server@${{ matrix.angular }}
      - run: pnpm exec vitest run packages/angular
